name: Publish onboarding Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: chromatic-hub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the workspace
        run: pnpm check

      - name: Publish the onboarding Hub
        run: pnpm deploy:hub
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_HUB_PROJECT_TOKEN }}
