name: Deploy onboarding Hub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the course
        run: pnpm check:onboarding

      - name: Build the hosted Hub
        run: pnpm --filter @demo/hub build-storybook
        env:
          STORYBOOK_HOSTED: 'true'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Hub
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/hub/storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
